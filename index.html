<style>

*{box-sizing:border-box}

.gate{max-width:380px;margin:12vh auto;padding:0 16px;display:grid;gap:12px}

@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)}
  .stagewrap{height:60vh;min-height:360px}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .search{width:100%}
  .tools{width:100%}
  .tools .field{flex:1 1 160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="gate" id="gate" hidden>
  <h1>ผังสายสกุล</h1>
  <p>ผังนี้เปิดดูได้เฉพาะคนในครอบครัว ใส่รหัสครอบครัวที่ได้รับจากผู้ดูแล</p>
  <form id="gateform">
    <label class="field" for="gatecode"><span>รหัสครอบครัว</span><input id="gatecode" autocomplete="off" required></label>
    <p class="err" id="gateerr" hidden>รหัสไม่ถูกต้อง ลองอีกครั้ง หรือถามผู้ดูแลผัง</p>
    <div class="row"><button class="btn primary" type="submit">เข้าดูผัง</button></div>
  </form>
</div>
<div class="app" id="app">
  <header>
    <div>
      <h1 id="title">ผังสายสกุล</h1>
      <p class="sub" id="sub">รวมรายชื่อญาติพี่น้อง พร้อมคำเรียกญาติแบบไทย</p>
    </div>
    <div class="tools">
      <label class="field" for="ego"><span>คำเรียก มองจากมุมของ</span>
        <select id="ego"></select></label>
      <div class="field search"><span>ค้นหาชื่อ</span>
        <input id="q" type="search" placeholder="ชื่อ หรือชื่อเล่น" autocomplete="off">

      </div>
    </div>

  <div class="banner" id="banner" hidden></div>
  <main>

      <div class="stage" id="stage"><div class="sizer" id="sizer"><div class="inner" id="inner"></div></div></div>
      <div class="msg" id="msg" hidden></div>
      <div class="zoom">
        <button id="zout" aria-label="ย่อ">−</button>
        <button id="zin" aria-label="ขยาย">+</button>
      </div>
    </div>

<script>
const W=176,H=84,CG=14,KG=22,RG=70,TG=64,PAD=28;
const NOW_BE=new Date().getFullYear()+543;
const CFG=window.FAMILY_CONFIG||{};
const S={mode:'demo',people:new Map(),sel:null,ego:null,panel:{t:'view'},zoom:1,
  editCode:null,viewCode:null,editing:false,sb:null,familyName:'',loadErr:null,editPrompt:false};

/* ---------- ตระกูลตัวอย่าง ---------- */
const DEMO=[
 {id:'d1',name:'สมชาย ศรีสวัสดิ์',gender:'m',birthYear:2478,deathYear:2558,spouseIds:['d2'],place:'อยุธยา'},
 {id:'d2',name:'บุญมา ศรีสวัสดิ์',gender:'f',birthYear:2482,deathYear:2561,spouseIds:['d1']},
 {id:'d3',name:'ประเสริฐ ศรีสวัสดิ์',gender:'m',birthYear:2503,birthOrder:1,fatherId:'d1',motherId:'d2',spouseIds:['d13']},
 {id:'d5',name:'สมศักดิ์ ศรีสวัสดิ์',gender:'m',birthYear:2507,birthOrder:2,fatherId:'d1',motherId:'d2',spouseIds:['d6']},
 {id:'d4',name:'วันเพ็ญ ศรีสวัสดิ์',gender:'f',birthYear:2511,birthOrder:3,fatherId:'d1',motherId:'d2'},
 {id:'d13',name:'ละออ ศรีสวัสดิ์',gender:'f',birthYear:2505,spouseIds:['d3']},
 {id:'d7',name:'ทองดี ใจงาม',gender:'m',birthYear:2485,deathYear:2563,spouseIds:['d8'],place:'สุพรรณบุรี'},
 {id:'d8',name:'สำเนียง ใจงาม',gender:'f',birthYear:2488,spouseIds:['d7']},
 {id:'d9',name:'สุดา ใจงาม',gender:'f',birthYear:2508,birthOrder:1,fatherId:'d7',motherId:'d8'},
 {id:'d6',name:'มาลี ศรีสวัสดิ์',nick:'ลี',gender:'f',birthYear:2512,birthOrder:2,fatherId:'d7',motherId:'d8',spouseIds:['d5']},
 {id:'d10',name:'วิชัย ใจงาม',gender:'m',birthYear:2515,birthOrder:3,fatherId:'d7',motherId:'d8'},
 {id:'d11',name:'ณัฐพล ศรีสวัสดิ์',nick:'ต้น',gender:'m',birthYear:2538,birthOrder:1,fatherId:'d5',motherId:'d6',spouseIds:['d16']},
 {id:'d12',name:'พิมพ์ชนก ศรีสวัสดิ์',nick:'แพร',gender:'f',birthYear:2541,birthOrder:2,fatherId:'d5',motherId:'d6',place:'กรุงเทพฯ'},
 {id:'d16',name:'ศิริพร ศรีสวัสดิ์',gender:'f',birthYear:2539,spouseIds:['d11']},
 {id:'d17',name:'ข้าวหอม ศรีสวัสดิ์',nick:'ข้าว',gender:'f',birthYear:2566,fatherId:'d11',motherId:'d16'},
 {id:'d14',name:'ธนากร ศรีสวัสดิ์',nick:'บอส',gender:'m',birthYear:2543,fatherId:'d3',motherId:'d13',note:'อายุน้อยกว่าแพร แต่แพรต้องเรียกว่า "พี่" เพราะพ่อของบอสเป็นพี่ของพ่อแพร'},
 {id:'d15',name:'กานต์ ใจงาม',gender:'m',birthYear:2536,fatherId:'d10',note:'อายุมากกว่าแพร แต่เป็น "น้อง" เพราะพ่อของกานต์เป็นน้องของแม่แพร'},
];
function loadDemo(){S.people=new Map(DEMO.map(p=>[p.id,{...p,spouseIds:[...(p.spouseIds||[])]}]));S.ego='d12';S.sel='d12';}

/* ---------- helpers ---------- */
const P=id=>S.people.get(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KIDS=new Map();
function indexKids(){KIDS=new Map();for(const p of S.people.values())for(const k of [p.fatherId,p.motherId])if(k&&S.people.has(k)){if(!KIDS.has(k))KIDS.set(k,[]);KIDS.get(k).push(p.id);}}
const parentsOf=p=>[p.fatherId,p.motherId].filter(x=>x&&S.people.has(x));
const spousesOf=p=>(p.spouseIds||[]).filter(x=>S.people.has(x));
const kidsOf=id=>KIDS.get(id)||[];
const label=p=>p?(p.nick?`${p.name} (${p.nick})`:p.name):'';
const short=p=>p.nick||p.name.split(' ')[0];
function sortKids(a){return a.sort((x,y)=>{const a1=P(x),b1=P(y);const o=(a1.birthOrder||99)-(b1.birthOrder||99);return o||(a1.birthYear||9999)-(b1.birthYear||9999);});}
function years(p){
  if(!p.birthYear&&!p.deathYear)return '';
  if(p.deathYear)return `พ.ศ. ${p.birthYear||'?'}–${p.deathYear}`;
  return `เกิด พ.ศ. ${p.birthYear} · อายุ ${NOW_BE-p.birthYear}`;
}
const newId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}
const photoSrc=p=>p.photo||'';
function initial(p){const s=(p.nick||p.name||'?').replace(/^[เแโใไ]/,'');return s.charAt(0)||'?';}
function avatar(p,big){const src=photoSrc(p);
  return `<span class="av${big?' big':''}" aria-hidden="true">${esc(initial(p))}${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;}
async function shrink(file){
  let bmp;try{bmp=await createImageBitmap(file);}catch(e){throw {code:'decode'};}
  for(const [max,q] of [[240,.82],[200,.72],[160,.65],[120,.6]]){
    const r=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',q);if(url.length<45000)return url;
  }
  throw {code:'decode'};
}
const photoErr=x=>x&&x.code==='decode'?'เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ JPG, PNG หรือ WEBP':'ใส่รูปไม่สำเร็จ ลองอีกครั้ง';

/* ---------- คำเรียกญาติ ---------- */
function ancestry(id){
  const m=new Map([[id,[id]]]);const q=[id];
  while(q.length){const c=q.shift();for(const p of parentsOf(P(c)))if(!m.has(p)){m.set(p,[...m.get(c),p]);q.push(p);}}
  return m;
}
function senior(x,y){
  const a=P(x),b=P(y);
  const same=parentsOf(a).some(i=>parentsOf(b).includes(i));
  if(same&&a.birthOrder&&b.birthOrder&&a.birthOrder!==b.birthOrder)return a.birthOrder<b.birthOrder?-1:1;
  if(a.birthYear&&b.birthYear&&a.birthYear!==b.birthYear)return a.birthYear<b.birthYear?-1:1;
  if(a.birthOrder&&b.birthOrder&&a.birthOrder!==b.birthOrder)return a.birthOrder<b.birthOrder?-1:1;
  return 0;
}
const up=id=>P(id).gender==='m'?'พ่อ':'แม่';
const down=id=>P(id).gender==='m'?'ลูกชาย':'ลูกสาว';
function sibWord(t,ref){const m=P(t).gender==='m',s=senior(t,ref);return s<0?(m?'พี่ชาย':'พี่สาว'):s>0?(m?'น้องชาย':'น้องสาว'):(m?'พี่/น้องชาย':'พี่/น้องสาว');}
const chain=w=>w.slice().reverse().join('ของ');
function blood(e,t){
  const A=ancestry(e),B=ancestry(t);let best=null;
  for(const [c,pe] of A)if(B.has(c)){const pt=B.get(c);const d=pe.length+pt.length;if(!best||d<best.d)best={d,pe,pt};}
  if(!best)return null;
  const {pe,pt}=best,a=pe.length-1,b=pt.length-1,m=P(t).gender==='m';
  const side=a>=1?P(pe[1]).gender:null;
  const gp=()=>side==='m'?(m?'ปู่':'ย่า'):(m?'ตา':'ยาย');
  if(b===0){
    const w=pe.slice(1).map(up);
    const term=a===1?(m?'พ่อ':'แม่'):a===2?gp():a===3?gp()+'ทวด':a===4?'เทียด':'บรรพบุรุษ';
    return {term,desc:a>1?chain(w):'',kind:a===1?'parent':'grand',side};
  }
  if(a===0){
    const w=pt.slice(0,b).reverse().map(down);
    const term=b===1?(m?'ลูกชาย':'ลูกสาว'):b===2?(m?'หลานชาย':'หลานสาว'):b===3?'เหลน':b===4?'โหลน':'ผู้สืบสกุล';
    return {term,desc:b>1?chain(w):'',kind:b===1?'child':'niece'};
  }
  const ce=pe[a-1],ct=pt[b-1],sen=senior(ct,ce);
  const w=[...pe.slice(1,a).map(up),sibWord(ct,ce),...pt.slice(0,b-1).reverse().map(down)];
  const desc=chain(w),gap=a-b;let term,kind,extra='';
  if(gap===0){
    if(a===1){term=sen<0?(m?'พี่ชาย':'พี่สาว'):sen>0?(m?'น้องชาย':'น้องสาว'):(m?'พี่/น้องชาย':'พี่/น้องสาว');kind='sibling';
      const pa=parentsOf(P(e)),pb=parentsOf(P(t));if(pa.length===2&&pb.length===2&&!(pa[0]===pb[0]&&pa[1]===pb[1]))extra='พี่น้องต่างพ่อหรือต่างแม่';
      return {term,desc:extra,kind,sen};}
    term=sen<0?'พี่':sen>0?'น้อง':'พี่/น้อง';kind='cousin';
    extra=a===2?'ลูกพี่ลูกน้อง':'ญาติรุ่นเดียวกัน';
    if(sen!==0)extra+=' · นับตามลำดับของพ่อแม่ ไม่ใช่อายุ';
  }else if(gap===1){
    term=sen<0?(m?'ลุง':'ป้า'):sen>0?(side==='m'?'อา':'น้า'):(m?'ลุง/'+(side==='m'?'อา':'น้า'):'ป้า/'+(side==='m'?'อา':'น้า'));kind='uncle';
  }else if(gap===2){term=gp();kind='grand';}
  else if(gap>=3){term=gp()+'ทวด';kind='grand';}
  else if(gap===-1){term=m?'หลานชาย':'หลานสาว';kind='niece';}
  else if(gap===-2){term='เหลน';kind='niece';}
  else {term='โหลน';kind='niece';}
  return {term,desc:extra?`${desc} (${extra})`:desc,kind,sen,side};
}
function kinship(e,t){
  if(!e||!t||!P(e)||!P(t))return null;
  if(e===t)return {term:'ฉัน',desc:''};
  const b=blood(e,t);if(b)return b;
  const T=P(t),m=T.gender==='m',E=P(e);
  if(spousesOf(E).includes(t))return {term:m?'สามี':'ภรรยา',desc:''};
  for(const s of spousesOf(T)){
    const r=blood(e,s);if(!r)continue;
    const who=(m?'สามี':'ภรรยา')+'ของ'+(r.desc&&!r.desc.includes('(')?r.desc:r.term);let term;
    if(r.kind==='uncle')term=r.term.startsWith('ลุง')||r.term.startsWith('ป้า')?(m?'ลุง':'ป้า'):r.term;
    else if(r.kind==='sibling')term=(r.sen<0?'พี่':r.sen>0?'น้อง':'พี่/น้อง')+(m?'เขย':'สะใภ้');
    else if(r.kind==='cousin')term=r.term;
    else if(r.kind==='child')term=m?'ลูกเขย':'ลูกสะใภ้';
    else if(r.kind==='niece')term=m?'หลานเขย':'หลานสะใภ้';
    else if(r.kind==='parent')term=m?'พ่อเลี้ยง':'แม่เลี้ยง';
    else if(r.kind==='grand')term=m?(r.side==='m'?'ปู่':'ตา'):(r.side==='m'?'ย่า':'ยาย');
    else term='คู่สมรสของ'+r.term;
    return {term,desc:who};
  }
  for(const sp of spousesOf(E)){
    const r=blood(sp,t);if(!r)continue;
    const spw=P(sp).gender==='m'?'สามี':'ภรรยา';let term=r.term;
    if(r.kind==='parent')term=E.gender==='m'?(m?'พ่อตา':'แม่ยาย'):(m?'พ่อสามี':'แม่สามี');
    return {term,desc:`${r.desc&&!r.desc.includes('(')?r.desc:r.term}ของ${spw}`};
  }
  return {term:'ญาติ',desc:'เกี่ยวดองกันทางอื่น'};
}

function layout(){
  indexKids();
  const g=new Map(),comp=new Map(),cmin=new Map();let ci=0;
  for(const id of S.people.keys()){if(g.has(id))continue;ci++;g.set(id,0);comp.set(id,ci);const q=[id];
    while(q.length){const c=q.shift(),p=P(c),v=g.get(c);
      const nb=[...parentsOf(p).map(x=>[x,v-1]),...kidsOf(c).map(x=>[x,v+1]),...spousesOf(p).map(x=>[x,v])];
      for(const [x,gv] of nb)if(!g.has(x)){g.set(x,gv);comp.set(x,ci);q.push(x);}}}
  for(const [id,v] of g){const c=comp.get(id);cmin.set(c,Math.min(cmin.get(c)??v,v));}
  const depth=id=>g.get(id)-cmin.get(comp.get(id));
  const placed=new Set(),isRoot=id=>parentsOf(P(id)).length===0;
  function mk(id,d){
    placed.add(id);const m=[id];
    for(const s of spousesOf(P(id)))if(!placed.has(s)&&isRoot(s)){m.push(s);placed.add(s);}
    m.sort((x,y)=>(P(x).gender==='m'?0:1)-(P(y).gender==='m'?0:1));
    const ks=new Set();m.forEach(x=>kidsOf(x).forEach(k=>ks.add(k)));
    const u={m,d,kids:[]};
    for(const k of sortKids([...ks]))if(!placed.has(k))u.kids.push(mk(k,d+1));
    return u;
  }
  const roots=[...S.people.keys()].filter(isRoot).sort((a,b)=>g.get(a)-g.get(b)||(P(a).birthYear||9999)-(P(b).birthYear||9999));
  const trees=[];
  for(const r of roots){if(placed.has(r))continue;const sp=spousesOf(P(r));if(sp.length&&sp.every(s=>!isRoot(s)))continue;trees.push(mk(r,depth(r)));}
  for(const id of S.people.keys())if(!placed.has(id))trees.push(mk(id,depth(id)));
  const meas=u=>{const own=u.m.length*W+(u.m.length-1)*CG;u.kids.forEach(meas);u.kw=u.kids.reduce((s,k)=>s+k.w,0)+Math.max(0,u.kids.length-1)*KG;u.own=own;u.w=Math.max(own,u.kw);};
  const pos=new Map(),units=[];
  const place=(u,x)=>{units.push(u);let kx=x+(u.w-u.kw)/2;u.kids.forEach(k=>{place(k,kx);kx+=k.w+KG;});
    let mx=x+(u.w-u.own)/2;if(u.kids.length){const c0=u.kids[0],cl=u.kids[u.kids.length-1];const kc=(c0.cx+cl.cx)/2;mx=Math.max(x,Math.min(x+u.w-u.own,kc-u.own/2));}
    u.m.forEach((id,i)=>pos.set(id,{x:mx+i*(W+CG),y:PAD+u.d*(H+RG)}));u.cx=mx+u.own/2;u.y=PAD+u.d*(H+RG);};
  let x=PAD;for(const t of trees){meas(t);place(t,x);x+=t.w+TG;}
  let maxY=0;for(const p of pos.values())maxY=Math.max(maxY,p.y);
  return {pos,units,w:x-TG+PAD,h:maxY+H+PAD};
}

function renderTree(){
  const inner=$('inner'),msg=$('msg');
  if(S.loadErr){inner.innerHTML='';msg.hidden=false;msg.innerHTML=`<p>${esc(S.loadErr)}</p>`;return;}
  if(!S.people.size){inner.innerHTML='';$('sizer').style.width=$('sizer').style.height='0';msg.hidden=false;
    msg.innerHTML=`<p>ยังไม่มีใครในผัง ${S.editing?'เริ่มจากเพิ่มตัวคุณเองทางขวา แล้วค่อยเพิ่มพ่อแม่ พี่น้อง และลูกหลาน':'ผู้ดูแลผังกด "เข้าสู่โหมดแก้ไข" เพื่อเริ่มเพิ่มรายชื่อ'}</p>`;return;}
  msg.hidden=true;L=layout();const {pos,units}=L;
  let path='',dash='';
  const kidAnchor=(u,k)=>k.m.find(id=>parentsOf(P(id)).some(x=>u.m.includes(x)))||k.m[0];
  for(const u of units){
    for(let i=0;i<u.m.length-1;i++){const a=pos.get(u.m[i]);path+=`M${a.x+W} ${a.y+H/2}H${a.x+W+CG}`;}
    if(!u.kids.length)continue;
    const yb=u.y+H,mid=yb+RG/2,cs=u.kids.map(k=>pos.get(kidAnchor(u,k)).x+W/2);
    path+=`M${u.cx} ${yb}V${mid}H${Math.min(u.cx,...cs)}H${Math.max(u.cx,...cs)}`;
    u.kids.forEach((k,i)=>{path+=`M${cs[i]} ${mid}V${pos.get(kidAnchor(u,k)).y}`;});
  }
  const seen=new Set();
  for(const u of units)for(const id of u.m)for(const s of spousesOf(P(id))){
    const key=[id,s].sort().join();if(seen.has(key))continue;seen.add(key);
    if(u.m.includes(s))continue;const a=pos.get(id),b=pos.get(s);if(!a||!b)continue;
    const ax=a.x+W/2,bx=b.x+W/2,top=Math.min(a.y,b.y)-24;dash+=`M${ax} ${a.y}C${ax} ${top},${bx} ${top},${bx} ${b.y}`;
  }
  let html=`<svg width="${L.w}" height="${L.h}" aria-hidden="true"><path d="${path}" fill="none" stroke="var(--line)" stroke-width="1.5"/><path d="${dash}" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5"/></svg>`;
  for(const [id,p] of pos){
    const per=P(id),k=kinship(S.ego,id);
    const cls=['card',id===S.sel?'sel':'',id===S.ego?'me':'',per.deathYear?'dead':''].join(' ');
    html+=`<button class="${cls}" data-id="${esc(id)}" style="left:${p.x}px;top:${p.y}px" aria-label="${esc(label(per))}">
      ${avatar(per)}<span class="txt">
      <span class="term">${k?esc(k.term):'&nbsp;'}</span>
      <span class="nm">${esc(per.nick?`${per.nick} · ${per.name.split(' ')[0]}`:per.name)}</span>
      <span class="yr">${esc(years(per)||(per.gender==='m'?'ชาย':'หญิง'))}</span></span></button>`;
  }
  inner.innerHTML=html;applyZoom();
}

    <div class="two">
      <label class="field" for="f-by"><span>ปีเกิด (พ.ศ.)</span><input id="f-by" inputmode="numeric" value="${esc(p.birthYear)}" placeholder="2530"></label>
      <label class="field" for="f-dy"><span>ปีที่ถึงแก่กรรม (พ.ศ.)</span><input id="f-dy" inputmode="numeric" value="${esc(p.deathYear)}" placeholder="ยังมีชีวิตอยู่"></label>
    </div>
    <div class="two">
      <label class="field" for="f-bo"><span>เป็นลูกคนที่</span><input id="f-bo" inputmode="numeric" value="${esc(p.birthOrder)}" placeholder="1"></label>
      <label class="field" for="f-pl"><span>ภูมิลำเนา</span><input id="f-pl" value="${esc(p.place)}"></label>
    </div>
    <p class="hint">ลำดับในพี่น้องและปีเกิดใช้ตัดสินว่าเป็นพี่หรือน้อง ลุงหรืออา ใส่ปี ค.ศ. ได้ ระบบจะแปลงเป็น พ.ศ. ให้</p>
    ${other}
    ${f.id?`<div class="two">
      <label class="field" for="f-fa"><span>พ่อ</span><select id="f-fa">${opts('m',p.fatherId)}</select></label>
      <label class="field" for="f-mo"><span>แม่</span><select id="f-mo">${opts('f',p.motherId)}</select></label></div>`:''}
    <label class="field" for="f-note"><span>บันทึก</span><textarea id="f-note" placeholder="อาชีพ เรื่องเล่า หรือสิ่งที่อยากให้ลูกหลานรู้">${esc(p.note)}</textarea></label>
    <p class="err" id="f-err" hidden></p>
    <div class="row" style="margin-top:4px"><button class="btn primary" type="submit">บันทึก</button><button class="btn" type="button" data-act="cancel">ยกเลิก</button></div>
  </form>`;
  $('f-name').focus();
}
function renderDel(el){
  const p=P(S.panel.id);
  el.innerHTML=`<h2>ลบ ${esc(label(p))} ออกจากผัง?</h2><p>ความเชื่อมโยงกับพ่อแม่ คู่สมรส และลูกของคนนี้จะถูกตัดออกด้วย ลบแล้วกู้คืนไม่ได้</p>
  <div class="row"><button class="btn danger solid" data-act="delyes">ลบ</button><button class="btn" data-act="cancel">ยกเลิก</button></div>`;
}

/* ---------- ฐานข้อมูล (Google Sheet ผ่าน Apps Script) ---------- */
async function api(action,payload){
  const r=await fetch(CFG.SHEET_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
  if(!r.ok)throw new Error('http_'+r.status);
  return await r.json();
}
function dbErr(e){const m=String(e&&e.message||e||'');
  if(m.includes('bad_code'))return 'รหัสแก้ไขไม่ถูกต้องหรือถูกเปลี่ยนแล้ว ออกจากโหมดแก้ไขแล้วใส่รหัสใหม่';
  return 'บันทึกไม่สำเร็จ ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองอีกครั้ง';}
async function putMany(list){
  for(const p of list)S.people.set(p.id,p);
  if(S.mode!=='real')return;
  const r=await api('save',{code:S.editCode,items:list});
  if(!r.ok)throw new Error(r.error||'save_failed');
}
async function remove(id){
  S.people.delete(id);
  if(S.mode!=='real')return;
  const r=await api('delete',{code:S.editCode,id});
  if(!r.ok)throw new Error(r.error||'delete_failed');
}
async function checkEdit(code){try{const r=await api('check',{code});return !!(r.ok&&r.valid);}catch(e){return false;}}
async function load(){
  let data;
  try{data=await api('get',{code:S.viewCode||''});}catch(e){data=null;}
  if(!data||(!data.ok&&data.reason!=='view_code')){S.loadErr='เชื่อมต่อ Google Sheet ไม่ได้ ตรวจว่าลิงก์ใน index.html ถูกต้อง และตั้ง Web app ให้ "Anyone" เข้าถึงได้ แล้วโหลดหน้านี้ใหม่';return 'error';}
  if(!data.ok)return 'gate';
  S.loadErr=null;S.familyName=data.name||'';
  S.people=new Map((data.people||[]).map(p=>[p.id,{...p,spouseIds:[...(p.spouseIds||[])]}]));
  if(S.ego&&!S.people.has(S.ego))S.ego=null;if(S.sel&&!S.people.has(S.sel))S.sel=null;
  return 'ok';
}
const yr=v=>{v=parseInt(String(v).replace(/[^\d]/g,''),10);if(!v)return undefined;return v<2300?v+543:v;};

async function submitForm(e){
  e.preventDefault();
  const f=S.panel,err=$('f-err');
  const name=$('f-name').value.trim(),gv=document.querySelector('input[name=g]:checked')?.value;
  if(!name||!gv){err.hidden=false;err.textContent=!name?'ใส่ชื่อก่อนบันทึก':'เลือกเพศ ระบบใช้เพศในการคำนวณคำเรียกญาติ';return;}
  const base=f.id?{...P(f.id)}:{id:newId(),spouseIds:[]};
  Object.assign(base,{name,gender:gv,nick:$('f-nick').value.trim()||undefined,birthYear:yr($('f-by').value),deathYear:yr($('f-dy').value),
    birthOrder:parseInt($('f-bo').value,10)||undefined,place:$('f-pl').value.trim()||undefined,note:$('f-note').value.trim()||undefined});
  const sub=e.target.querySelector('[type=submit]');sub.disabled=true;
  if(f.file){try{base.photo=await shrink(f.file);}catch(x){err.hidden=false;err.textContent=photoErr(x)+' หรือบันทึกโดยไม่ใส่รูป';f.file=null;sub.disabled=false;return;}}
  try{
    const writes=[];
    if(f.id){base.fatherId=$('f-fa').value||undefined;base.motherId=$('f-mo').value||undefined;writes.push(base);}
    else{
      const of=f.of?{...P(f.of),spouseIds:[...(P(f.of).spouseIds||[])]}:null;
      if(f.rel==='father'||f.rel==='mother'){
        of[f.rel==='father'?'fatherId':'motherId']=base.id;
        const otherId=f.rel==='father'?of.motherId:of.fatherId;
        if(otherId&&P(otherId)){const o={...P(otherId),spouseIds:[...(P(otherId).spouseIds||[]),base.id]};base.spouseIds.push(otherId);writes.push(base,of,o);}
        else writes.push(base,of);
      }else if(f.rel==='spouse'){base.spouseIds.push(of.id);of.spouseIds.push(base.id);writes.push(base,of);}
      else if(f.rel==='child'){
        base[of.gender==='m'?'fatherId':'motherId']=of.id;
        const o=$('f-other')?.value;if(o)base[of.gender==='m'?'motherId':'fatherId']=o;writes.push(base);
      }else if(f.rel==='sibling'){base.fatherId=of.fatherId;base.motherId=of.motherId;writes.push(base);}
      else writes.push(base);
    }
    await putMany(writes);
    if(f.rel==='self'||!S.ego){S.ego=base.id;if(S.mode==='real')store('kin-ego',base.id);}
    S.sel=base.id;S.panel={t:'view'};render();centerOn(base.id);
  }catch(x){sub.disabled=false;err.hidden=false;err.textContent=dbErr(x);if(S.mode==='real')refresh();}
}
async function delPerson(id){
  try{
    const changed=[];
    for(const p of S.people.values()){
      if(p.id===id)continue;
      if(p.fatherId===id||p.motherId===id||(p.spouseIds||[]).includes(id)){
        const n={...p,spouseIds:(p.spouseIds||[]).filter(s=>s!==id)};if(n.fatherId===id)delete n.fatherId;if(n.motherId===id)delete n.motherId;changed.push(n);}
    }
    if(changed.length)await putMany(changed);
    await remove(id);if(S.ego===id)S.ego=null;S.sel=null;S.panel={t:'view'};render();
  }catch(x){S.panel={t:'view'};await refresh();}
}
async function refresh(){if(S.mode!=='real')return;const r=await load();if(r==='ok'&&S.panel.t!=='form')render();else if(r==='ok'){renderTree();renderEgo();renderBanner();}else if(r==='error')render();}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const c=e.target.closest('.card');if(c){S.sel=c.dataset.id;S.panel={t:'view'};render();if(innerWidth<=860)$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
  const go=e.target.closest('[data-go]');if(go){$('results').hidden=true;S.sel=go.dataset.go;S.panel={t:'view'};render();centerOn(S.sel);return;}
  const add=e.target.closest('[data-add]');if(add&&!add.disabled){S.panel={t:'form',rel:add.dataset.add,of:S.sel};renderPanel();return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='addself')S.panel={t:'form',rel:'self'};
  else if(act==='edit')S.panel={t:'form',id:S.sel};
  else if(act==='cancel')S.panel={t:'view'};
  else if(act==='del')S.panel={t:'del',id:S.sel};
  else if(act==='delyes')return delPerson(S.panel.id);
  else if(act==='me'){S.ego=S.sel;if(S.mode==='real')store('kin-ego',S.ego);}
  else if(act==='askedit')S.editPrompt=true;
  else if(act==='canceledit')S.editPrompt=false;
  else if(act==='exitedit'){S.editing=false;S.editCode=null;store('kin-edit',null);S.panel={t:'view'};}
  else if(act==='rmphoto'){const n={...P(S.sel)};delete n.photo;try{await putMany([n]);}catch(x){await refresh();}}
  else if(act==='linksp'){const v=$('linksp').value;if(!v)return;const A=P(S.sel),B=P(v);
    try{await putMany([{...A,spouseIds:[...new Set([...(A.spouseIds||[]),v])]},{...B,spouseIds:[...new Set([...(B.spouseIds||[]),A.id])]}]);}catch(x){await refresh();}}
  render();
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f-photo'){const file=e.target.files[0];if(!file)return;S.panel.file=file;
    const pv=$('f-prev');pv.textContent='';const img=document.createElement('img');img.alt='';img.src=URL.createObjectURL(file);pv.appendChild(img);return;}
  if(e.target.id==='ph-file'){const file=e.target.files[0];if(!file)return;const id=S.sel;
    e.target.parentElement.firstChild.textContent='กำลังบันทึก…';
    try{const photo=await shrink(file);await putMany([{...P(id),photo}]);render();}
    catch(x){renderPanel();const er=$('ph-err');if(er){er.hidden=false;er.textContent=x&&x.code==='decode'?photoErr(x):dbErr(x);}}}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='pform')return submitForm(e);
  if(e.target.id==='editform'){e.preventDefault();const code=$('editcode').value.trim();
    const btn=e.target.querySelector('[type=submit]');btn.disabled=true;const ok=await checkEdit(code);btn.disabled=false;
    if(!ok){$('editerr').hidden=false;return;}
    S.editCode=code;S.editing=true;S.editPrompt=false;store('kin-edit',code);render();return;}
  if(e.target.id==='gateform'){e.preventDefault();S.viewCode=$('gatecode').value.trim();
    const r=await load();if(r==='gate'){$('gateerr').hidden=false;return;}
    store('kin-view',S.viewCode);$('gate').hidden=true;$('app').hidden=false;afterLoad();}
});
$('ego').addEventListener('change',e=>{S.ego=e.target.value||null;if(S.mode==='real')store('kin-ego',S.ego);render();});
$('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(),r=$('results');
  if(!q){r.hidden=true;return;}
  const hits=[...S.people.values()].filter(p=>(p.name+' '+(p.nick||'')).toLowerCase().includes(q)).slice(0,6);
  r.hidden=false;r.innerHTML=hits.length?hits.map(p=>`<button data-go="${esc(p.id)}">${esc(label(p))}</button>`).join(''):'<button disabled>ไม่พบชื่อนี้</button>';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').hidden=true;});
$('zin').onclick=()=>{S.zoom=Math.min(1.6,S.zoom+.15);applyZoom();};
$('zout').onclick=()=>{S.zoom=Math.max(.4,S.zoom-.15);applyZoom();};
(()=>{const st=$('stage');let d=null;
  st.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('.card'))return;d={x:e.clientX,y:e.clientY,l:st.scrollLeft,t:st.scrollTop};st.classList.add('drag');});
  addEventListener('pointermove',e=>{if(!d)return;st.scrollLeft=d.l-(e.clientX-d.x);st.scrollTop=d.t-(e.clientY-d.y);});
  addEventListener('pointerup',()=>{d=null;st.classList.remove('drag');});})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
setInterval(()=>{if(document.visibilityState==='visible'&&S.panel.t==='view')refresh();},60000);

/* ---------- start ---------- */
function afterLoad(){
  const e=recall('kin-ego');S.ego=e&&S.people.has(e)?e:null;S.sel=S.ego;S.panel={t:'view'};
  render();requestAnimationFrame(()=>centerOn(S.ego||S.people.keys().next().value));
  const code=recall('kin-edit');
  if(code)checkEdit(code).then(ok=>{if(ok){S.editCode=code;S.editing=true;}else store('kin-edit',null);renderBanner();renderPanel();});
}
(async()=>{
  if(!CFG.SHEET_API){loadDemo();render();requestAnimationFrame(()=>centerOn(S.ego));return;}
  S.mode='real';
  S.viewCode=recall('kin-view')||'';
  $('msg').hidden=false;$('msg').innerHTML='<p>กำลังโหลดผังตระกูล…</p>';
  const r=await load();
  if(r==='gate'){$('app').hidden=true;$('gate').hidden=false;$('gatecode').focus();return;}
  afterLoad();
})();
</script>
